<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="bdShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="128" fill="#FAF8F5" stroke="#E5E0D5" stroke-width="8" />

  <!-- Subtle BD halftone or warm backdrop shape -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#F4EFE6" opacity="0.6"/>

  {/* Group with slight drop shadow */}
  <g filter="url(#bdShadow)">
    {/* --- BULLE 1 : BLEUE FRANÇAISE BD (GAUCHE) --- */}
    <g id="bulle-fr">
      {/* Ombre portée plate BD */}
      <path
        d="M 140 95 C 90 95 60 125 60 180 C 60 225 90 255 140 255 L 150 255 L 100 335 L 190 255 L 270 255 C 320 255 350 225 350 180 C 350 125 320 95 270 95 Z"
        fill="#0F172A"
        opacity="0.15"
        transform="translate(10, 14)"
      />
      {/* Corps bulle bleue */}
      <path
        d="M 140 95 C 90 95 60 125 60 180 C 60 225 90 255 140 255 L 150 255 L 100 335 L 190 255 L 270 255 C 320 255 350 225 350 180 C 350 125 320 95 270 95 Z"
        fill="#1E56B3"
        stroke="#111827"
        stroke-width="16"
        stroke-linejoin="round"
        stroke-linecap="round"
      />
      {/* Dégradé doux intérieur */}
      <path
        d="M 140 105 C 100 105 72 130 72 180 C 72 190 75 200 80 210 C 95 140 155 110 260 110 C 265 106 240 105 140 105 Z"
        fill="#3B82F6"
        opacity="0.5"
      />
      {/* Reflet blanc courbé BD */}
      <path
        d="M 95 135 C 110 112 145 105 195 105"
        stroke="#FFFFFF"
        stroke-width="14"
        stroke-linecap="round"
        opacity="0.8"
      />
      <circle cx="85" cy="155" r="7" fill="#FFFFFF" opacity="0.8" />
      {/* Typo BD FR */}
      <text
        x="195"
        y="200"
        fill="#FFFFFF"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="72"
        font-weight="900"
        letter-spacing="4px"
        text-anchor="middle"
      >FR</text>
    </g>

    {/* --- ÉTINCELLE BD DE CONVERSATION --- */}
    <g transform="translate(245, 150)">
      <path
        d="M 0 -30 Q 3 -5 25 0 Q 3 5 0 30 Q -3 5 -25 0 Q -3 -5 0 -30 Z"
        fill="#FBBF24"
        stroke="#111827"
        stroke-width="6"
      />
      <circle cx="0" cy="0" r="7" fill="#FFFFFF" />
    </g>

    {/* --- BULLE 2 : ROUGE NORVÉGIENNE BD (DROITE / PREMIER PLAN) --- */}
    <g id="bulle-no">
      {/* Ombre portée plate BD */}
      <path
        d="M 260 190 C 210 190 180 220 180 275 C 180 320 210 350 260 350 L 335 350 L 410 420 L 370 350 L 390 350 C 440 350 470 320 470 275 C 470 220 440 190 390 190 Z"
        fill="#0F172A"
        opacity="0.15"
        transform="translate(10, 14)"
      />
      {/* Corps bulle rouge */}
      <path
        d="M 260 190 C 210 190 180 220 180 275 C 180 320 210 350 260 350 L 335 350 L 410 420 L 370 350 L 390 350 C 440 350 470 320 470 275 C 470 220 440 190 390 190 Z"
        fill="#D92838"
        stroke="#111827"
        stroke-width="16"
        stroke-linejoin="round"
        stroke-linecap="round"
      />
      {/* Dégradé doux intérieur */}
      <path
        d="M 260 200 C 220 200 192 225 192 275 C 192 285 195 295 200 305 C 215 235 275 205 380 205 C 385 201 360 200 260 200 Z"
        fill="#EF4444"
        opacity="0.5"
      />
      {/* Reflet blanc courbé BD */}
      <path
        d="M 215 230 C 230 207 265 200 315 200"
        stroke="#FFFFFF"
        stroke-width="14"
        stroke-linecap="round"
        opacity="0.8"
      />
      <circle cx="205" cy="250" r="7" fill="#FFFFFF" opacity="0.8" />
      {/* Typo BD NO */}
      <text
        x="330"
        y="295"
        fill="#FFFFFF"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="72"
        font-weight="900"
        letter-spacing="4px"
        text-anchor="middle"
      >NO</text>
    </g>

    {/* Petits traits d'action BD */}
    <g stroke="#111827" stroke-width="8" stroke-linecap="round" opacity="0.7">
      <line x1="45" y1="110" x2="35" y2="95" />
      <line x1="450" y1="375" x2="470" y2="385" />
    </g>
  </g>
</svg>
